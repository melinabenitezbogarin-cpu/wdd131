<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WDD131 - Form,Product Review</title>
    <meta name="description"
        content="WDD 131 - This is a Form of a product review with different spaces to put users opinions.">
    <meta name="author" content="Melina Benitez Bogarin">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">


    <link rel="stylesheet" href="styles/form.css">

    <script src="scripts/form.js" defer></script>
</head>

<body>
    <header>
        <h1>Product Review</h1>
    </header>
    <main>
        <form method="get" action="review.html">

            <label for="product-select">Product Name</label>
            <select name="product" id="product-select" required>
                <option value="">Choose a Product ... </option>
            </select>

            <fieldset>
                <legend>Overall Rating</legend>
                <div class="rating-group">
                    <label for="rating1">
                        <span class="stars">&star;</span>
                        <input type="radio" id="rating1" name="rafting" value="1" required>
                    </label>
                    <label for="rating2">
                        <span class="stars">&star;&star;</span>
                        <input type="radio" id="rating2" name="rafting" value="2" required>
                    </label>
                    <label for="rating3">
                        <span class="stars">&star;&star;&star;</span>
                        <input type="radio" id="rating3" name="rafting" value="3" required>
                    </label>
                    <label for="rating4">
                        <span class="stars">&star;&star;&star;&star;</span>
                        <input type="radio" id="rating4" name="rafting" value="4" required>
                    </label>
                    <label for="rating5">
                        <span class="stars">&star;&star;&star;&star;&star;</span>
                        <input type="radio" id="rating5" name="rafting" value="5" required>
                    </label>
                </div>
            </fieldset>

            <label for="install-date">Date of Installation</label>
            <input type="date" id="intall-date" name="installDate" required>

            <fieldset class="features-fieldset">
                <legend>Which features did you find useful in the product?<br><span class="subtitle">(Check all that
                        apply)</span></legend>
                <label for="feature-durability">
                    <input type="checkbox" id="feature-durability" name="features" value="durability">
                    Durability</label>
                <label for="feature-use">
                    <input type="checkbox" id="feature-use" name="features" value="ease-of-use">
                    Ease of Use</label>
                <label for="feature-performance">
                    <input type="checkbox" id="feature-performance" name="features" value="performance">
                    Performance</label>
                <label for="feature-design">
                    <input type="checkbox" id="feature-design" name="features" value="desing">
                    Design</label>
            </fieldset>

            <label>Written Review <span class="optional">(Optional)</span></label>
            <textarea name="writtenReview" id="written-review" rows="4"></textarea>


            <label for="user-name">Your Name <span class="optional">(Optional)</span></label>
            <input type="text" id="user-name" name="userName">

            <input type="submit" value="Post Review">

        </form>
    </main>

    <footer>
        <p>&copy;<span id="currentyear"></span> 🌎 Melina Benitez Bogarin 🌎 Buenos Aires Argentina</p>
        <p id="lastModified"></p>
    </footer>
</body>
